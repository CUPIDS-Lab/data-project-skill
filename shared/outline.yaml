  templates/project/data/original/.gitkeep: 2
  templates/project/tests/test_source.py: 2
  # Extract
  templates/project/scripts/parsers/__init__.py: 3
  templates/project/scripts/provenance.py: 3
  templates/project/tests/fixtures/.gitkeep: 3
  # Model & tidy
  templates/project/scripts/schema.py.tmpl: 4
  templates/project/scripts/clean.py: 4
  templates/project/scripts/concepts.py: 4
  templates/project/data/lookups/*: 4
  templates/project/docs/data-dictionary.md.tmpl: 4
  templates/project/docs/filter-pivot-recipes.md.tmpl: 4
  templates/project/tests/test_schema.py: 4
  templates/project/tests/test_clean.py: 4
  templates/project/tests/test_concepts.py: 4
  templates/project/tests/test_lookups.py: 4
  # Pipeline & audit
  templates/project/scripts/__init__.py.tmpl: 5
  templates/project/scripts/__main__.py: 5
  templates/project/scripts/pipeline.py.tmpl: 5
  templates/project/scripts/audit.py: 5
  templates/project/scripts/reconcile.py: 5
  templates/project/scripts/runlog.py: 5
  templates/project/data/processed/.gitkeep: 5
  templates/project/data/audit/.gitkeep: 5
  templates/project/tests/conftest.py: 5
  templates/project/tests/test_reconcile.py: 5
  templates/project/pyproject.toml.tmpl: 5
  templates/project/.gitignore: 5
  templates/project/.gitattributes.tmpl: 5
  templates/project/.github/workflows/tests.yml: 5
  # Document & cite
  templates/project/README.md.tmpl: 6
  templates/project/AGENTS.md.tmpl: 6
  templates/project/CLAUDE.md: 6
  templates/project/CHANGELOG.md.tmpl: 6
  templates/project/LICENSE.tmpl: 6
  templates/project/decision-log.md.tmpl: 6
  templates/project/docs/methodology.qmd.tmpl: 6
  templates/project/tests/test_generated_docs.py: 6
  # Publish
  templates/project/scripts/publish.py.tmpl: 8
  templates/project/scripts/upload_documentcloud.py: 8
