# Which Outline section owns each reference and template.
#
# tools/validate.py fails unless every file under skills/<name>/references/ and
# skills/<name>/templates/ (except vendored _shared/ copies) and every file in shared/
# matches exactly one pattern here. Sections are 1–10, or "outline" for files that
# serve the whole Outline. A feedback issue filed against a section is fixed in the
# files mapped to it.
#
# Patterns are relative to the skill folder (or to shared/) and use pathlib
# full_match semantics: "*" stays within one directory, "**" crosses directories.

shared:
  OUTLINE.md: outline
  references/values-and-gates.md: 1
  references/responsible-data.md: 1
  references/quality-and-bulletproofing.md: 5
  references/standards-and-fair.md: 6
  references/governance.md: 7
  references/practice-sources.md: outline
  references/feedback.md: 10
  templates/decision-log.md.tmpl: 6
  templates/ROADMAP.md.tmpl: 10

data-liberation:
  references/lineage-and-landscape.md: 1
  references/extract-web.md: 2
  references/extract-api.md: 2
  references/extract-pdf.md: 3
  references/extract-images.md: 3
  references/extract-documents.md: 3
  references/extract-tabular.md: 3
  references/data-modeling.md: 4
  references/pipeline.md: 5
  references/project-template.md: 5
  references/publishing.md: 8
  # Acquire
