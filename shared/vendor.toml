# Content vendored into both skills by tools/vendor.py.
# Each [[file]] copies shared/<src> to every path in dest (repository-relative).
# Markdown copies get a "vendored from" header; other files are copied byte-for-byte.

[[file]]
src = "OUTLINE.md"
dest = ["OUTLINE.md", "skills/data-liberation/references/_shared/OUTLINE.md", "skills/data-project/references/_shared/OUTLINE.md"]

[[file]]
src = "references/feedback.md"
dest = ["skills/data-liberation/references/_shared/feedback.md", "skills/data-project/references/_shared/feedback.md"]

[[file]]
src = "templates/ROADMAP.md.tmpl"
dest = ["skills/data-liberation/templates/project/ROADMAP.md.tmpl", "skills/data-project/templates/ROADMAP.md.tmpl"]

[[file]]
src = "templates/decision-log.md.tmpl"
dest = ["skills/data-liberation/templates/project/decision-log.md.tmpl", "skills/data-project/templates/decision-log.md.tmpl"]

[[file]]
src = "references/values-and-gates.md"
dest = ["skills/data-liberation/references/_shared/values-and-gates.md", "skills/data-project/references/_shared/values-and-gates.md"]

