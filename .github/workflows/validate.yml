name: validate

# Guards both skills on every change. Each job runs one skill's validator from tools/;
# a later phase merges them into a single tools/validate.py.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  data-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate skills/data-project
        run: python tools/validate_data_project.py

  data-liberation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Validate skills/data-liberation and smoke-test the rendered project
        run: uv run --no-project python tools/validate_data_liberation.py --smoke
