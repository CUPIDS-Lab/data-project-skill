name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No `lfs: true` — schema and unit tests run against checked-in
        # fixtures, not raw LFS data. Saves bandwidth quota.

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies (incl. publish extras for sanity-check)
        run: uv sync --extra publish

      - name: Lint
        run: |
          uv run ruff check scripts tests
          uv run ruff format --check scripts tests

      - name: Type-check (advisory)
        continue-on-error: true
        run: uv run mypy scripts

      - name: Test
        run: uv run pytest -q

      - name: Sanity-check CLI imports
        run: |
          uv run python -m scripts.pipeline --help
          uv run python -m scripts.publish --help
